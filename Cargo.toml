[package]
name = "macboot"
version = "0.1.0"
edition = "2021"
description = "A native, idempotent macOS developer-machine provisioner: dotfiles, packages, and settings from one declarative binary."
license = "MIT"
repository = "https://github.com/aaukhatov/macboot"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["macos", "dotfiles", "provisioning", "homebrew"]

[[bin]]
name = "macboot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "5"
owo-colors = { version = "4", features = ["supports-colors"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
